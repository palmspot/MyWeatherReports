<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root,[data-theme="light"]{--bg:#fff;--bg2:#f5f5f3;--bg3:#efefed;--text:#1a1a18;--text2:#6b6b67;--border:rgba(0,0,0,0.12);--info-bg:#E6F1FB;--info-text:#0C447C;--rm:8px;--rl:12px}
[data-theme="dark"]{--bg:#1a1a18;--bg2:#242422;--bg3:#2e2e2c;--text:#f0f0ee;--text2:#9a9a96;--border:rgba(255,255,255,0.12);--info-bg:#0C447C;--info-text:#B5D4F4}
body{font-family:-apple-system,BlinkMacSystemFont,'Hiragino Sans','Yu Gothic',sans-serif;background:var(--bg3);color:var(--text);min-height:100vh}
.wrap{max-width:960px;margin:0 auto;padding:1.5rem 1rem}
.topbar{display:flex;align-items:center;justify-content:space-between;margin-bottom:1rem;flex-wrap:wrap;gap:8px}
.title{font-size:20px;font-weight:500}
.meta{font-size:12px;color:var(--text2);margin-top:3px}
.acts{display:flex;gap:8px;align-items:center}
button{font-family:inherit;font-size:13px;padding:6px 14px;cursor:pointer;border-radius:var(--rm);border:0.5px solid var(--border);background:var(--bg);color:var(--text)}
button:hover{background:var(--bg2)}
.icon-btn{padding:6px 10px;font-size:16px}
.location-bar{display:flex;align-items:center;gap:6px;margin-bottom:1.25rem;flex-wrap:wrap}
.loc-tab{font-size:13px;padding:6px 14px;cursor:pointer;border-radius:var(--rm);border:0.5px solid var(--border);background:var(--bg);color:var(--text2);display:flex;align-items:center;gap:6px;white-space:nowrap}
.loc-tab.active{background:var(--info-bg);color:var(--info-text);border-color:transparent;font-weight:500}
.loc-tab .del{opacity:.6;cursor:pointer;padding:0 2px}.loc-tab .del:hover{opacity:1;color:#A32D2D}
.add-loc-btn{font-size:13px;padding:6px 12px;border-radius:var(--rm);border:0.5px dashed var(--border);background:transparent;color:var(--text2);cursor:pointer}
.add-loc-btn:hover{background:var(--bg2)}
.add-form{background:var(--bg);border:0.5px solid var(--border);border-radius:var(--rl);padding:14px 16px;margin-bottom:1.25rem}
.add-form-row{display:grid;grid-template-columns:1fr 1fr 1fr 1fr auto;gap:8px;align-items:end}
.add-form-row label{font-size:11px;color:var(--text2);display:block;margin-bottom:3px}
.add-form-row input{width:100%;font-size:13px;padding:6px 10px;border-radius:var(--rm);border:0.5px solid var(--border);background:var(--bg2);color:var(--text);font-family:inherit}
.add-form-presets{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.preset-btn{font-size:11px;padding:3px 10px;border-radius:99px;border:0.5px solid var(--border);background:var(--bg2);color:var(--text2);cursor:pointer}
.preset-btn:hover{background:var(--info-bg);color:var(--info-text)}
.add-form-note{font-size:11px;color:var(--text2);margin-top:8px}
/* 地図検索 */
.map-search-box{background:var(--bg);border:0.5px solid var(--border);border-radius:var(--rl);padding:14px 16px;margin-top:10px}
.map-search-row{display:flex;gap:8px;align-items:center;margin-bottom:8px;flex-wrap:wrap}
.map-search-row input{flex:1;min-width:200px;font-size:13px;padding:6px 10px;border-radius:var(--rm);border:0.5px solid var(--border);background:var(--bg2);color:var(--text);font-family:inherit}
#map-container{width:100%;height:260px;border-radius:var(--rm);border:0.5px solid var(--border);overflow:hidden;margin-bottom:8px}
.map-result{font-size:12px;color:var(--text2);padding:4px 0}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:1.25rem}
.chip{font-size:11px;padding:3px 10px;border-radius:99px;border:0.5px solid var(--border);color:var(--text2);background:var(--bg)}
.chip.on{background:var(--info-bg);color:var(--info-text);border-color:transparent}
.metrics{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin-bottom:1.5rem}
.mc{background:var(--bg2);border-radius:var(--rm);padding:12px 14px}
.mc .lb{font-size:12px;color:var(--text2);margin-bottom:4px}
.mc .vl{font-size:22px;font-weight:500}
.mc .sb{font-size:12px;color:var(--text2);margin-top:2px}
.stitle{font-size:12px;font-weight:500;color:var(--text2);margin-bottom:8px;letter-spacing:.04em;text-transform:uppercase}
/* グラフ */
.chart-section{margin-bottom:1.5rem}
.chart-tabs{display:flex;gap:6px;margin-bottom:10px}
.chart-tab{font-size:12px;padding:4px 12px;cursor:pointer;border-radius:99px;border:0.5px solid var(--border);background:var(--bg);color:var(--text2)}
.chart-tab.active{background:var(--info-bg);color:var(--info-text);border-color:transparent}
.chart-wrap{background:var(--bg);border:0.5px solid var(--border);border-radius:var(--rl);padding:14px;position:relative;height:220px}
.chart-wrap canvas{width:100%!important;height:100%!important}
/* 気象庁詳細 */
.jma-detail{background:var(--bg);border:0.5px solid var(--border);border-radius:var(--rl);padding:14px 16px;margin-bottom:1.5rem}
.jma-detail-title{font-size:13px;font-weight:500;margin-bottom:10px;display:flex;align-items:center;gap:6px}
.jma-weather-text{font-size:13px;color:var(--text);margin-bottom:10px;line-height:1.6;padding:8px 12px;background:var(--bg2);border-radius:var(--rm)}
.jma-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:8px;margin-bottom:10px}
.jma-item{background:var(--bg2);border-radius:var(--rm);padding:8px 12px}
.jma-item .lb{font-size:11px;color:var(--text2);margin-bottom:3px}
.jma-item .vl{font-size:14px;font-weight:500;color:var(--text)}
.jma-pop-row{display:grid;grid-template-columns:repeat(6,1fr);gap:4px;margin-bottom:10px}
.jma-pop-cell{background:var(--bg2);border-radius:var(--rm);padding:6px 4px;text-align:center}
.jma-pop-cell .pt{font-size:10px;color:var(--text2)}
.jma-pop-cell .pv{font-size:13px;font-weight:500;color:var(--info-text)}
.jma-7day{overflow-x:auto;margin-bottom:4px}
.jma-7tbl{width:100%;border-collapse:collapse;font-size:12px;min-width:500px}
.jma-7tbl th{text-align:center;padding:5px 4px;font-weight:500;color:var(--text2);border-bottom:0.5px solid var(--border);font-size:11px}
.jma-7tbl td{padding:5px 4px;border-bottom:0.5px solid var(--border);text-align:center;color:var(--text)}
.jma-7tbl tr:last-child td{border-bottom:none}
.rel-A{color:#1B7F3A;font-weight:500}.rel-B{color:#BA7517}.rel-C{color:#9a9a96}
.today-col{background:var(--info-bg)!important}
/* マルチソース予報 */
.mf{margin-bottom:1.5rem}
.mfrow{display:grid;grid-template-columns:90px repeat(7,1fr);gap:4px;margin-bottom:4px;align-items:center}
.mflb{font-size:11px;padding:4px;border-radius:4px;text-align:center;font-weight:500}
.mfhd{font-size:11px;color:var(--text2);text-align:center;padding:2px 0}
.mfhd.td{color:var(--info-text);font-weight:500}
.mfc{background:var(--bg);border:0.5px solid var(--border);border-radius:var(--rm);padding:6px 2px;text-align:center;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;min-height:68px}
.mfc.td{border:1.5px solid var(--info-text)}
.mfc .ci{font-size:18px;color:var(--text)}.mfc .ct{font-size:12px;font-weight:500;color:var(--text)}
.mfc .cl{font-size:11px;color:var(--text2)}.mfc .cr{font-size:11px;color:var(--info-text)}
.mfc .cn{font-size:10px;color:var(--text2)}.mfc.empty{background:transparent;border-color:transparent}
.hourly{display:grid;grid-template-columns:repeat(8,1fr);gap:6px;margin-bottom:1.5rem}
.hc{background:var(--bg2);border-radius:var(--rm);padding:8px 4px;text-align:center}
.hc .ht{font-size:11px;color:var(--text2)}.hc .hv{font-size:14px;font-weight:500;margin:3px 0}.hc .hr{font-size:11px;color:var(--info-text)}
.ctbl{width:100%;border-collapse:collapse;font-size:13px;table-layout:fixed;min-width:500px}
.ctbl th{text-align:left;padding:8px 10px;font-weight:500;color:var(--text2);border-bottom:0.5px solid var(--border);font-size:12px}
.ctbl td{padding:8px 10px;border-bottom:0.5px solid var(--border);color:var(--text);vertical-align:middle}
.ctbl tr:last-child td{border-bottom:none}
.tag{display:inline-block;font-size:11px;padding:2px 7px;border-radius:4px;margin-right:4px;white-space:nowrap}
.t-om{background:#E6F1FB;color:#0C447C}.t-gfs{background:#FAEEDA;color:#633806}
.t-jma{background:#EAF3DE;color:#27500A}.t-owm{background:#FBEAF0;color:#72243E}
.t-tmrw{background:#EEEDFE;color:#3C3489}.t-wapi{background:#E1F5EE;color:#085041}
.barwrap{display:flex;align-items:center;gap:8px}
.barbg{flex:1;height:6px;background:var(--bg3);border-radius:3px;overflow:hidden;min-width:40px}
.barfill{height:100%;border-radius:3px;background:#378ADD}
.keypanel{background:var(--bg);border:0.5px solid var(--border);border-radius:var(--rl);padding:14px 16px;margin-bottom:1.5rem}
.keyrow{display:flex;gap:8px;align-items:center;margin-bottom:6px;flex-wrap:wrap}
.keyrow input{flex:1;min-width:180px;font-size:13px;padding:6px 10px;border-radius:var(--rm);border:0.5px solid var(--border);background:var(--bg2);color:var(--text);font-family:inherit}
.keynote{font-size:12px;color:var(--text2);margin-top:8px}
.loading{text-align:center;padding:3rem;color:var(--text2);font-size:14px}
.errmsg{color:#A32D2D;font-size:13px;padding:12px;background:#FCEBEB;border-radius:var(--rm)}
.footer{font-size:11px;color:var(--text2);margin-top:8px}
a{color:var(--info-text)}
@media(max-width:600px){.add-form-row{grid-template-columns:1fr 1fr}.mfrow{grid-template-columns:70px repeat(7,1fr)}.mflb{font-size:10px}}
</style>
</head>
<body>
<div class="wrap">
  <div class="topbar">
    <div>
      <div class="title"><i class="ti ti-map-pin" style="font-size:16px;vertical-align:-2px;margin-right:4px"></i><span id="page-title" data-i18n="app_title">天気予報ダッシュボード</span></div>
      <div class="meta" id="updated-at"></div>
    </div>
    <div class="acts">
      <button class="icon-btn" onclick="toggleLang()" id="lang-btn" title="日本語/English">EN</button>
      <button class="icon-btn" onclick="toggleTheme()" title="テーマ切替"><i class="ti ti-moon" id="theme-icon"></i></button>
      <button onclick="loadAll()"><i class="ti ti-refresh" style="font-size:14px;vertical-align:-2px"></i> <span data-i18n="refresh">更新</span></button>
    </div>
  </div>

  <div class="location-bar" id="location-bar"></div>

  <div class="add-form" id="add-form" style="display:none">
    <div style="font-size:13px;font-weight:500;margin-bottom:10px"><i class="ti ti-map-pin" style="font-size:14px;vertical-align:-2px;margin-right:4px"></i><span data-i18n="add_location">地点を追加</span></div>
    <div class="add-form-row">
      <div><label data-i18n="loc_name">地点名</label><input type="text" id="new-name" data-i18n-placeholder="loc_name_ph"></div>
      <div><label data-i18n="latitude">緯度</label><input type="number" id="new-lat" placeholder="34.6937" step="0.0001"></div>
      <div><label data-i18n="longitude">経度</label><input type="number" id="new-lon" placeholder="135.5023" step="0.0001"></div>
      <div><label data-i18n="jma_code">気象庁コード（任意）</label><input type="text" id="new-jma" placeholder="270000"></div>
      <div style="padding-bottom:0"><button onclick="addLocation()"><i class="ti ti-plus" style="font-size:13px;vertical-align:-1px"></i> <span data-i18n="add">追加</span></button></div>
    </div>
    <div class="add-form-presets">
      <span style="font-size:11px;color:var(--text2);padding:3px 0" data-i18n="presets">よく使う地点：</span>
      <button class="preset-btn" onclick="setPreset('大阪',34.6937,135.5023,'270000')" data-i18n-preset="osaka">大阪</button>
      <button class="preset-btn" onclick="setPreset('東京',35.6895,139.6917,'130000')" data-i18n-preset="tokyo">東京</button>
      <button class="preset-btn" onclick="setPreset('名古屋',35.1815,136.9066,'230000')" data-i18n-preset="nagoya">名古屋</button>
      <button class="preset-btn" onclick="setPreset('札幌',43.0642,141.3469,'016000')" data-i18n-preset="sapporo">札幌</button>
      <button class="preset-btn" onclick="setPreset('福岡',33.5904,130.4017,'400000')" data-i18n-preset="fukuoka">福岡</button>
      <button class="preset-btn" onclick="setPreset('那覇',26.2124,127.6809,'471000')" data-i18n-preset="naha">那覇</button>
      <button class="preset-btn" onclick="setPreset('仙台',38.2688,140.8721,'040000')" data-i18n-preset="sendai">仙台</button>
      <button class="preset-btn" onclick="setPreset('広島',34.3853,132.4553,'340000')" data-i18n-preset="hiroshima">広島</button>
      <button class="preset-btn" onclick="setPreset('金沢',36.5944,136.6256,'170000')" data-i18n-preset="kanazawa">金沢</button>
    </div>
    <!-- 地図で場所を選ぶ -->
    <div style="margin-top:10px">
      <button onclick="toggleMapSearch()" style="font-size:12px;padding:4px 10px;border-radius:99px"><i class="ti ti-map" style="font-size:13px;vertical-align:-1px;margin-right:3px"></i><span data-i18n="pick_on_map">地図から選択</span></button>
    </div>
    <div class="map-search-box" id="map-search-box" style="display:none">
      <div class="map-search-row">
        <input type="text" id="map-search-input" data-i18n-placeholder="search_place" placeholder="地名・住所で検索">
        <button onclick="searchPlace()"><i class="ti ti-search" style="font-size:13px;vertical-align:-1px"></i> <span data-i18n="search">検索</span></button>
        <button onclick="useCurrentLocation()"><i class="ti ti-current-location" style="font-size:13px;vertical-align:-1px"></i> <span data-i18n="current_loc">現在地</span></button>
      </div>
      <div id="map-container"></div>
      <div class="map-result" id="map-result"></div>
      <button onclick="applyMapLocation()" id="apply-map-btn" style="display:none;margin-top:6px"><i class="ti ti-check" style="font-size:13px;vertical-align:-1px"></i> <span data-i18n="use_this_location">この地点を使用</span></button>
    </div>
    <div class="add-form-note" data-i18n="latlon_hint">緯度・経度はGoogle マップで右クリックすると確認できます。</div>
  </div>

  <div class="chips">
    <span class="chip on">Open-Meteo</span>
    <span class="chip on">GFS</span>
    <span class="chip on" data-i18n-chip="jma">気象庁</span>
    <span class="chip" id="chip-owm">OpenWeatherMap</span>
    <span class="chip" id="chip-tmrw">Tomorrow.io</span>
    <span class="chip" id="chip-wapi">WeatherAPI</span>
  </div>

  <div id="main-content">
    <div class="loading"><i class="ti ti-cloud-download" style="font-size:28px;display:block;margin-bottom:8px"></i><span data-i18n="loading">天気データを取得中...</span></div>
  </div>

  <div class="keypanel">
    <div class="stitle" style="margin-bottom:10px" data-i18n="api_keys">APIキー設定（任意・無料）</div>
    <div class="keyrow"><span class="tag t-owm" style="min-width:120px;text-align:center">OpenWeatherMap</span><input type="text" id="owm-key" data-i18n-placeholder="api_key_ph"></div>
    <div class="keyrow"><span class="tag t-tmrw" style="min-width:120px;text-align:center">Tomorrow.io</span><input type="text" id="tmrw-key" data-i18n-placeholder="api_key_ph"></div>
    <div class="keyrow"><span class="tag t-wapi" style="min-width:120px;text-align:center">WeatherAPI</span><input type="text" id="wapi-key" data-i18n-placeholder="api_key_ph"></div>
    <button onclick="applyKeys()" style="margin-top:6px"><i class="ti ti-check" style="font-size:13px;vertical-align:-1px"></i> <span data-i18n="apply">適用して更新</span></button>
    <div class="keynote" data-i18n="api_note">無料登録：OpenWeatherMap（1,000回/日）　Tomorrow.io（500回/日）　WeatherAPI（100万回/月）</div>
  </div>
</div>

<!-- Leaflet地図 -->
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<!-- Chart.js -->
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>

<script>
// ==================== i18n ====================
var I18N={
  ja:{
    title:'天気予報ダッシュボード',app_title:'天気予報ダッシュボード',refresh:'更新',
    add_location:'地点を追加',loc_name:'地点名',loc_name_ph:'例：東京',latitude:'緯度',longitude:'経度',
    jma_code:'気象庁コード（任意）',add:'追加',presets:'よく使う地点：',
    pick_on_map:'地図から選択',search_place:'地名・住所で検索',search:'検索',

var DEFAULT_LOCATIONS=[{name:'大阪',lat:34.6937,lon:135.5023,jma:'270000'},{name:'東京',lat:35.6895,lon:139.6917,jma:'130000'}];
function loadLocations(){try{var s=localStorage.getItem('locations');return s?JSON.parse(s):DEFAULT_LOCATIONS;}catch(e){return DEFAULT_LOCATIONS;}}
function saveLocations(l){localStorage.setItem('locations',JSON.stringify(l));}
function getCurrentIdx(){return parseInt(localStorage.getItem('loc_idx')||'0')||0;}
function setCurrentIdx(i){localStorage.setItem('loc_idx',String(i));}

function renderLocationBar(){
  var locs=loadLocations();var idx=getCurrentIdx();if(idx>=locs.length)idx=0;
  var html=locs.map(function(loc,i){
    var del=locs.length>1?'<span class="del" onclick="deleteLocation('+i+',event)"><i class="ti ti-x" style="font-size:11px"></i></span>':'';
    return '<div class="loc-tab'+(i===idx?' active':'')+'" onclick="switchLocation('+i+')"><i class="ti ti-map-pin" style="font-size:12px"></i>'+loc.name+del+'</div>';
  }).join('');
  html+='<button class="add-loc-btn" onclick="toggleAddForm()"><i class="ti ti-plus" style="font-size:13px;vertical-align:-1px"></i> '+t('add_loc_btn')+'</button>';
  document.getElementById('location-bar').innerHTML=html;
}
function switchLocation(i){setCurrentIdx(i);renderLocationBar();document.getElementById('add-form').style.display='none';loadAll();}
function deleteLocation(i,e){
  e.stopPropagation();var locs=loadLocations();
  if(locs.length<=1){alert(t('min_loc'));return;}
  if(!confirm('"'+locs[i].name+'"'+t('del_confirm')))return;
  locs.splice(i,1);saveLocations(locs);
  var idx=getCurrentIdx();if(idx>=locs.length)setCurrentIdx(locs.length-1);
  renderLocationBar();loadAll();
}
function toggleAddForm(){var f=document.getElementById('add-form');f.style.display=f.style.display==='none'?'block':'none';}
function setPreset(name,lat,lon,jma){
  document.getElementById('new-name').value=name;
  document.getElementById('new-lat').value=lat;
  document.getElementById('new-lon').value=lon;
  document.getElementById('new-jma').value=jma;
}
function addLocation(){
  var name=document.getElementById('new-name').value.trim();
  var lat=parseFloat(document.getElementById('new-lat').value);
  var lon=parseFloat(document.getElementById('new-lon').value);
  var jma=document.getElementById('new-jma').value.trim();
  if(!name||isNaN(lat)||isNaN(lon)){alert(t('loc_required'));return;}

  setCurrentIdx(locs.length-1);document.getElementById('add-form').style.display='none';
  document.getElementById('new-name').value='';document.getElementById('new-lat').value='';
  document.getElementById('new-lon').value='';document.getElementById('new-jma').value='';

var _map=null,_marker=null,_pickedLat=null,_pickedLon=null,_pickedName='';
function toggleMapSearch(){
  var box=document.getElementById('map-search-box');
  var show=box.style.display==='none';
  box.style.display=show?'block':'none';
  if(show&&!_map) initMap();
}
function initMap(){
  var locs=loadLocations();var idx=getCurrentIdx();var loc=locs[idx]||{lat:35.6895,lon:139.6917};
  _map=L.map('map-container').setView([loc.lat,loc.lon],10);
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{attribution:'© OpenStreetMap'}).addTo(_map);
  _map.on('click',function(e){pickLocationWithGeocode(e.latlng.lat,e.latlng.lng);});
}
function reverseGeocode(lat,lon,callback){
  var lang=getLang()==='en'?'en':'ja';
  fetch('https://nominatim.openstreetmap.org/reverse?format=json&lat='+lat+'&lon='+lon+'&accept-language='+lang)
    .then(function(r){return r.json();})
    .then(function(data){
      var name='';
      if(data&&data.address){
        // 市区町村 > 町名 > 都市の順で取得
        name=data.address.city||data.address.town||data.address.village||data.address.county||data.address.state||'';
        // さらに細かい地名があれば付加
        var sub=data.address.suburb||data.address.neighbourhood||data.address.quarter||'';
        if(sub&&name) name=sub+' ('+name+')';
        else if(sub) name=sub;
      }
      if(!name) name=data&&data.display_name?data.display_name.split(',')[0]:'';
      callback(name||'');
    })
    .catch(function(){callback('');});
}
function pickLocation(lat,lon,name){
  _pickedLat=lat;_pickedLon=lon;_pickedName=name;
  if(_marker)_map.removeLayer(_marker);
  _marker=L.marker([lat,lon]).addTo(_map);
  document.getElementById('map-result').textContent=t('map_selected')+(name||lat.toFixed(4)+', '+lon.toFixed(4))+' ('+lat.toFixed(4)+', '+lon.toFixed(4)+')';
  document.getElementById('apply-map-btn').style.display='inline-block';
  document.getElementById('new-lat').value=lat.toFixed(4);
  document.getElementById('new-lon').value=lon.toFixed(4);
  // 地名欄が空のときだけ地名を入れる（緯度経度は入れない）
  if(!document.getElementById('new-name').value&&name) document.getElementById('new-name').value=name;
}
function pickLocationWithGeocode(lat,lon){
  // まずマーカーだけ先に立て、逆ジオコーディング後に地名を反映
  pickLocation(lat,lon,'');
  document.getElementById('map-result').textContent='地名を取得中...';
  reverseGeocode(lat,lon,function(name){
    _pickedName=name;
    document.getElementById('map-result').textContent=t('map_selected')+(name||lat.toFixed(4)+', '+lon.toFixed(4))+' ('+lat.toFixed(4)+', '+lon.toFixed(4)+')';
    if(!document.getElementById('new-name').value) document.getElementById('new-name').value=name;
  });
}
function searchPlace(){
  var q=document.getElementById('map-search-input').value.trim();
  if(!q)return;
  var lang=getLang()==='en'?'en':'ja';
  fetch('https://nominatim.openstreetmap.org/search?format=json&q='+encodeURIComponent(q)+'&limit=1&accept-language='+lang)
    .then(function(r){return r.json();})
    .then(function(data){
      if(data&&data[0]){
        var lat=parseFloat(data[0].lat),lon=parseFloat(data[0].lon);
        var name=data[0].display_name.split(',')[0];
        _map.setView([lat,lon],12);
        pickLocation(lat,lon,name);
      }
    });
}
function useCurrentLocation(){
  if(!navigator.geolocation){alert('Geolocation not supported');return;}
  navigator.geolocation.getCurrentPosition(function(pos){
    var lat=pos.coords.latitude,lon=pos.coords.longitude;
    _map.setView([lat,lon],12);
    pickLocationWithGeocode(lat,lon);
  });
}
function applyMapLocation(){
  if(_pickedLat===null)return;
  document.getElementById('new-lat').value=_pickedLat.toFixed(4);
  document.getElementById('new-lon').value=_pickedLon.toFixed(4);
  if(!document.getElementById('new-name').value) document.getElementById('new-name').value=_pickedName;
  document.getElementById('map-search-box').style.display='none';
}

function buildJmaDetail(jma){
  if(!jma)return '';
  try{
    var ts0=jma[0].timeSeries;
    var ts1=jma[1]&&jma[1].timeSeries;
    var area0=ts0[0]&&ts0[0].areas&&ts0[0].areas[0];
    var weatherText=area0&&area0.weathers&&area0.weathers[0]||'';
    var windText=area0&&area0.winds&&area0.winds[0]||'';
    var waveText=area0&&area0.waves&&area0.waves[0]||'';
    var tempArea=ts0[2]&&ts0[2].areas&&ts0[2].areas[0];
    var temps=tempArea&&tempArea.temps||[];
    var tempMin=temps[2]||'—';var tempMax=temps[3]||'—';
    var popArea=ts0[1]&&ts0[1].areas&&ts0[1].areas[0];
    var pops=popArea&&popArea.pops||[];
    var popTimes=ts0[1]&&ts0[1].timeDefines||[];
    var popHtml='';
    if(pops.length){
      popHtml='<div class="stitle" style="margin-top:10px;margin-bottom:6px">'+t('pop_6h')+'</div><div class="jma-pop-row">';
      for(var pi=0;pi<Math.min(pops.length,6);pi++){
        var pt=popTimes[pi]?new Date(popTimes[pi]):null;
        var ptStr=pt?(pt.getMonth()+1)+'/'+(pt.getDate())+' '+pt.getHours()+'時':'—';
        popHtml+='<div class="jma-pop-cell"><div class="pt">'+ptStr+'</div><div class="pv">'+(pops[pi]!==''?pops[pi]+'%':'—')+'</div></div>';
      }
      popHtml+='</div>';
    }
    var week7Html='';
    if(ts1&&ts1[0]&&ts1[0].areas){
      var wa=ts1[0].areas[0];
      var wCodes=wa.weatherCodes||[];
      var wPops=wa.pops||[];
      var wRels=wa.reliabilities||[];
      var wTimes=ts1[0].timeDefines||[];
      var tempA=ts1[1]&&ts1[1].areas&&ts1[1].areas[0];
      var tMax=tempA&&tempA.tempsMax||[];
      var tMin=tempA&&tempA.tempsMin||[];
      var tMaxU=tempA&&tempA.tempsMaxUpper||[];
      var tMinL=tempA&&tempA.tempsMinLower||[];
      var DAYS=t('days');
      week7Html='<div class="stitle" style="margin-top:10px;margin-bottom:6px">'+t('week7')+'</div><div class="jma-7day"><table class="jma-7tbl"><thead><tr><th>'+t('date')+'</th>';
      wTimes.forEach(function(tm,i){
        var d=new Date(tm);
        // 実際の日付から曜日・日付を判定
        var now=new Date();var todayStr=now.toDateString();var tmStr=d.toDateString();
        var tomorrowD=new Date(now);tomorrowD.setDate(now.getDate()+1);
        var lb;
        if(tmStr===todayStr) lb=t('today_lbl');
        else if(tmStr===tomorrowD.toDateString()) lb=t('tomorrow_lbl');
        else lb=DAYS[d.getDay()]+(getLang()==='ja'?'曜':'');
        lb+='<br><span style="font-size:10px">'+(d.getMonth()+1)+'/'+(d.getDate())+'</span>';
        week7Html+='<th>'+lb+'</th>';
      });
      week7Html+='</tr></thead><tbody>';
      week7Html+='<tr><td style="color:var(--text2);font-size:11px">'+t('weather_lbl')+'</td>';
      wTimes.forEach(function(tm,i){var ic=wCodes[i]?jmaIcon(wCodes[i]):'ti-cloud';week7Html+='<td><i class="ti '+ic+'" style="font-size:16px"></i></td>';});
      week7Html+='</tr>';
      week7Html+='<tr><td style="color:var(--text2);font-size:11px">'+t('hi')+'</td>';
      wTimes.forEach(function(tm,i){var v=tMax[i]!==undefined&&tMax[i]!==''?tMax[i]+'°':'—';var u=tMaxU[i]!==undefined&&tMaxU[i]!==''?'<span style="font-size:10px;color:var(--text2)"> ~'+tMaxU[i]+'</span>':'';week7Html+='<td style="font-weight:500">'+v+u+'</td>';});
      week7Html+='</tr>';
      week7Html+='<tr><td style="color:var(--text2);font-size:11px">'+t('lo')+'</td>';
      wTimes.forEach(function(tm,i){var v=tMin[i]!==undefined&&tMin[i]!==''?tMin[i]+'°':'—';var l=tMinL[i]!==undefined&&tMinL[i]!==''?'<span style="font-size:10px;color:var(--text2)">'+tMinL[i]+'~</span>':'';week7Html+='<td>'+l+v+'</td>';});
      week7Html+='</tr>';
      week7Html+='<tr><td style="color:var(--text2);font-size:11px">'+t('pop')+'</td>';
      wTimes.forEach(function(tm,i){var v=wPops[i]!==''&&wPops[i]!==undefined?wPops[i]+'%':'—';week7Html+='<td style="color:var(--info-text)">'+v+'</td>';});
      week7Html+='</tr>';
      week7Html+='<tr><td style="color:var(--text2);font-size:11px">'+t('reliability')+'</td>';
      wTimes.forEach(function(tm,i){var r=wRels[i]||'';var cls=r==='A'?'rel-A':r==='B'?'rel-B':'rel-C';week7Html+='<td class="'+cls+'">'+(r||'—')+'</td>';});
      week7Html+='</tr></tbody></table></div>';
    }
    var gridHtml='<div class="jma-grid">';
    if(tempMin!=='—'||tempMax!=='—') gridHtml+='<div class="jma-item"><div class="lb"><i class="ti ti-temperature" style="font-size:12px;vertical-align:-1px;margin-right:3px"></i>'+t('today_temp')+'</div><div class="vl">'+t('hi')+' '+tempMax+'° / '+t('lo')+' '+tempMin+'°</div></div>';
    if(windText) gridHtml+='<div class="jma-item"><div class="lb"><i class="ti ti-wind" style="font-size:12px;vertical-align:-1px;margin-right:3px"></i>'+t('wind_lbl')+'</div><div class="vl" style="font-size:12px;line-height:1.5">'+windText+'</div></div>';
    if(waveText) gridHtml+='<div class="jma-item"><div class="lb"><i class="ti ti-waves" style="font-size:12px;vertical-align:-1px;margin-right:3px"></i>'+t('wave_lbl')+'</div><div class="vl" style="font-size:12px;line-height:1.5">'+waveText+'</div></div>';
    gridHtml+='</div>';
    return '<div class="jma-detail"><div class="jma-detail-title"><span class="tag t-jma">'+t('jma_chip')+'</span>'+t('jma_detail')+'</div>'+(weatherText?'<div class="jma-weather-text"><i class="ti ti-news" style="font-size:13px;vertical-align:-1px;margin-right:4px"></i>'+weatherText+'</div>':'')+gridHtml+popHtml+week7Html+'</div>';
  }catch(e){console.warn('JMA detail error',e);return'';}
}

// ==================== グラフ ====================
var _charts={};
function destroyCharts(){Object.values(_charts).forEach(function(c){c.destroy();});_charts={};}
function getChartColors(){
  var dark=document.documentElement.getAttribute('data-theme')==='dark';
  return{grid:dark?'rgba(255,255,255,0.08)':'rgba(0,0,0,0.08)',text:dark?'#9a9a96':'#6b6b67',bg:dark?'#242422':'#ffffff'};
}
function buildCharts(om,gfs){
  destroyCharts();
  var cc=getChartColors();
  var baseOpts={responsive:true,maintainAspectRatio:false,plugins:{legend:{labels:{color:cc.text,font:{size:11}}},tooltip:{mode:'index',intersect:false}},scales:{x:{grid:{color:cc.grid},ticks:{color:cc.text,font:{size:10}}},y:{grid:{color:cc.grid},ticks:{color:cc.text,font:{size:10}}}}};

  // 日次グラフ（今日の時間別気温）
  var now=new Date();
  var hourLabels=[],omHourly=[],gfsLabel=[];
  for(var i=0;i<24;i++){
    var idx=om.hourly.time.findIndex(function(t2){var d=new Date(t2);return d.getDate()===now.getDate()&&d.getHours()===i;});
    if(idx>=0){hourLabels.push(i+'時');omHourly.push(Math.round(om.hourly.temperature_2m[idx]));}
  }

  var dCtx=document.getElementById('daily-chart');
  if(dCtx){
    _charts.daily=new Chart(dCtx,{type:'line',data:{labels:hourLabels,datasets:[{label:'Open-Meteo',data:omHourly,borderColor:'#378ADD',backgroundColor:'rgba(55,138,221,0.1)',tension:0.4,pointRadius:3,fill:true}]},options:Object.assign({},baseOpts,{plugins:Object.assign({},baseOpts.plugins,{title:{display:true,text:t('daily_chart'),color:cc.text,font:{size:12}}})})});
  }

  // 週次グラフ（7日間最高・最低）
  var DAYS=t('days');
  var weekLabels=om.daily.time.slice(0,7).map(function(ds,i){
    var d=new Date(ds);
    return i===0?t('today_lbl'):i===1?t('tomorrow_lbl'):DAYS[d.getDay()];
  });
  var omMax=om.daily.temperature_2m_max.slice(0,7).map(Math.round);
  var omMin=om.daily.temperature_2m_min.slice(0,7).map(Math.round);
  var gfsMax=gfs.daily.temperature_2m_max.slice(0,7).map(Math.round);
  var gfsMin=gfs.daily.temperature_2m_min.slice(0,7).map(Math.round);

  var wCtx=document.getElementById('weekly-chart');
  if(wCtx){
    _charts.weekly=new Chart(wCtx,{type:'line',data:{labels:weekLabels,datasets:[
      {label:'OM '+t('max_temp'),data:omMax,borderColor:'#E05C2A',backgroundColor:'rgba(224,92,42,0.08)',tension:0.4,pointRadius:4,fill:false},
      {label:'OM '+t('min_temp'),data:omMin,borderColor:'#378ADD',backgroundColor:'rgba(55,138,221,0.08)',tension:0.4,pointRadius:4,fill:false},
      {label:'GFS '+t('max_temp'),data:gfsMax,borderColor:'#E05C2A',borderDash:[5,3],tension:0.4,pointRadius:3,fill:false},
      {label:'GFS '+t('min_temp'),data:gfsMin,borderColor:'#378ADD',borderDash:[5,3],tension:0.4,pointRadius:3,fill:false},
    ]},options:Object.assign({},baseOpts,{plugins:Object.assign({},baseOpts.plugins,{title:{display:true,text:t('weekly_chart'),color:cc.text,font:{size:12}}})})});
  }
}
var _activeChart='daily';
function switchChart(tab){
  _activeChart=tab;
  document.getElementById('daily-wrap').style.display=tab==='daily'?'block':'none';
  document.getElementById('weekly-wrap').style.display=tab==='weekly'?'block':'none';
  document.querySelectorAll('.chart-tab').forEach(function(el){el.classList.toggle('active',el.getAttribute('data-tab')===tab);});
}

// ==================== メイン描画 ====================
function buildChartSection(){
  var da=_activeChart==='daily';var we=_activeChart==='weekly';
  return '<div class="chart-section">'
    +'<div class="stitle">'+t('temp_chart')+'</div>'
    +'<div class="chart-tabs">'
    +'<button class="chart-tab'+(da?' active':'')+'" data-tab="daily" onclick="switchChart(this.dataset.tab)">'+t('daily_chart')+'</button>'
    +'<button class="chart-tab'+(we?' active':'')+'" data-tab="weekly" onclick="switchChart(this.dataset.tab)">'+t('weekly_chart')+'</button>'
    +'</div>'
    +'<div id="daily-wrap" class="chart-wrap" style="display:'+(da?'block':'none')+'"><canvas id="daily-chart"></canvas></div>'
    +'<div id="weekly-wrap" class="chart-wrap" style="display:'+(we?'block':'none')+'"><canvas id="weekly-chart"></canvas></div>'
    +'</div>';
}
function buildContent(loc,om,gfs,jma,owm,tmrw,wapi){
  window._lastBuildArgs=[loc,om,gfs,jma,owm,tmrw,wapi];
  var now=new Date();
  var DAYS=t('days');
  var h0=Math.floor(now.getHours()/3)*3;
  var hIdx=om.hourly.time.findIndex(function(t2){return t2.includes('T'+String(h0).padStart(2,'0')+':00');});
  var cTemp=hIdx>=0?Math.round(om.hourly.temperature_2m[hIdx]):'--';
  var cWind=hIdx>=0?Math.round(om.hourly.windspeed_10m[hIdx]):'--';
  var cHum=hIdx>=0?Math.round(om.hourly.relativehumidity_2m[hIdx]):'--';
  var cCode=hIdx>=0?om.hourly.weathercode[hIdx]:0;
  var avgMax=Math.round((om.daily.temperature_2m_max[0]+gfs.daily.temperature_2m_max[0])/2);
  var avgMin=Math.round((om.daily.temperature_2m_min[0]+gfs.daily.temperature_2m_min[0])/2);
  var rainToday=Math.round(om.daily.precipitation_probability_max[0]);

  var jmaDateMap={};var jmaMax=[],jmaMin=[],jmaRain=[],jmaCodes=[];
  if(jma&&jma[1]&&jma[1].timeSeries){
    var ts1=jma[1].timeSeries;
    var a0=ts1[0]&&ts1[0].areas&&ts1[0].areas[0];
    if(a0){jmaCodes=a0.weatherCodes||[];jmaRain=(a0.pops||[]).map(function(p){var v=parseInt(p);return isNaN(v)?null:v;});(ts1[0].timeDefines||[]).forEach(function(t2,i){jmaDateMap[t2.slice(0,10)]=i;});}
    var a1=ts1[1]&&ts1[1].areas&&ts1[1].areas[0];
    if(a1){jmaMax=a1.tempsMax||[];jmaMin=a1.tempsMin||[];}
  }

  var dates=om.daily.time.slice(0,7);
  var headHtml=dates.map(function(ds,i){
    var d=new Date(ds);
    var lb=i===0?t('today_lbl'):i===1?t('tomorrow_lbl'):DAYS[d.getDay()]+(getLang()==='ja'?'曜':'');
    return '<div class="mfhd'+(i===0?' td':'')+'">'+lb+'<br><span style="font-size:10px">'+(d.getMonth()+1)+'/'+(d.getDate())+'</span></div>';
  }).join('');

  var omCells=dates.map(function(ds,i){return mfc(i===0,omIcon(om.daily.weathercode[i]),Math.round(om.daily.temperature_2m_max[i]),Math.round(om.daily.temperature_2m_min[i]),Math.round(om.daily.precipitation_probability_max[i]),'');}).join('');
  var gfsCells=dates.map(function(ds,i){return mfc(i===0,omIcon(gfs.daily.weathercode?gfs.daily.weathercode[i]:0),Math.round(gfs.daily.temperature_2m_max[i]),Math.round(gfs.daily.temperature_2m_min[i]),Math.round(gfs.daily.precipitation_probability_max[i]),'');}).join('');
  var jmaCells=dates.map(function(ds,i){
    var ji=jmaDateMap.hasOwnProperty(ds)?jmaDateMap[ds]:null;
    var mx=ji!==null&&jmaMax[ji]!==undefined&&jmaMax[ji]!==''?jmaMax[ji]:'—';
    var mn=ji!==null&&jmaMin[ji]!==undefined&&jmaMin[ji]!==''?jmaMin[ji]:'—';
    var rn=ji!==null&&jmaRain[ji]!==null&&jmaRain[ji]!==undefined?jmaRain[ji]:'—';
    var wc=ji!==null&&jmaCodes[ji]?jmaCodes[ji]:null;
    var ic=wc?jmaIcon(wc):'ti-cloud';
    return '<div class="mfc'+(i===0?' td':'')+'"><div class="ci"><i class="ti '+ic+'"></i></div><div class="ct">'+mx+'°</div><div class="cl">'+mn+'°</div><div class="cr">'+(rn!=='—'?rn+'%':'—')+'</div></div>';
  }).join('');

  var owmCells='';
  if(owm&&owm.list){
    document.getElementById('chip-owm').classList.add('on');
    owmCells='<div class="mfrow"><div class="mflb t-owm">OWM</div>'+dates.map(function(ds,i){var items=owm.list.filter(function(it){return it.dt_txt.startsWith(ds);});if(!items.length)return '<div class="mfc empty"></div>';var noon=items.find(function(it){return it.dt_txt.includes('12:00:00');})||items[Math.floor(items.length/2)];return mfc(i===0,owmIcon(noon.weather[0].id),Math.round(Math.max.apply(null,items.map(function(it){return it.main.temp_max;}))),Math.round(Math.min.apply(null,items.map(function(it){return it.main.temp_min;}))),Math.round(Math.max.apply(null,items.map(function(it){return (it.pop||0)*100;}))),noon.weather[0].description);}).join('')+'</div>';
  }
  var tmrwCells='';
  if(tmrw&&tmrw.timelines&&tmrw.timelines.daily){
    document.getElementById('chip-tmrw').classList.add('on');
    var td=tmrw.timelines.daily;
    tmrwCells='<div class="mfrow"><div class="mflb t-tmrw">Tomorrow</div>'+dates.map(function(ds,i){if(!td[i])return '<div class="mfc empty"></div>';var v=td[i].values;return mfc(i===0,tmrwIcon(v.weatherCodeMax||v.weatherCode||0),Math.round(v.temperatureMax),Math.round(v.temperatureMin),Math.round(v.precipitationProbabilityAvg||0),'');}).join('')+'</div>';
  }
  var wapiCells='';
  if(wapi&&wapi.forecast&&wapi.forecast.forecastday){
    document.getElementById('chip-wapi').classList.add('on');
    var fd=wapi.forecast.forecastday;
    wapiCells='<div class="mfrow"><div class="mflb t-wapi">WeatherAPI</div>'+dates.map(function(ds,i){if(!fd[i])return '<div class="mfc empty"></div>';var day=fd[i].day;return mfc(i===0,wapiIcon(day.condition.code),Math.round(day.maxtemp_c),Math.round(day.mintemp_c),Math.round(day.daily_chance_of_rain),day.condition.text);}).join('')+'</div>';
  }

  var hourlyHtml=Array.from({length:8},function(_,i){
    var h=(h0+i*3)%24;
    var idx=om.hourly.time.findIndex(function(t2){var d=new Date(t2);return d.getDate()===now.getDate()&&d.getHours()===h;});
    var temp=idx>=0?Math.round(om.hourly.temperature_2m[idx]):'--';
    var rain=idx>=0?Math.round(om.hourly.precipitation_probability[idx]):'--';
    return '<div class="hc"><div class="ht">'+String(h).padStart(2,'0')+(getLang()==='ja'?'時':'h')+'</div><div class="hv">'+temp+'°</div><div class="hr">'+rain+'%</div></div>';
  }).join('');

  var compareRows=om.daily.time.slice(0,5).map(function(ds,i){
    var d=new Date(ds);var lb=i===0?t('today_lbl'):i===1?t('tomorrow_lbl'):(d.getMonth()+1)+'/'+(d.getDate());
    var omR=Math.round(om.daily.precipitation_probability_max[i]);
    var ji=jmaDateMap.hasOwnProperty(ds)?jmaDateMap[ds]:null;
    var jR=ji!==null&&jmaRain[ji]!==null&&jmaRain[ji]!==undefined?jmaRain[ji]:null;
    var jMx=ji!==null&&jmaMax[ji]!==undefined&&jmaMax[ji]!==''?jmaMax[ji]:'—';
    var jMn=ji!==null&&jmaMin[ji]!==undefined&&jmaMin[ji]!==''?jmaMin[ji]:'—';
    var bar=jR!==null?Math.round((omR+jR)/2):omR;
    return '<tr><td style="font-weight:500">'+lb+'</td><td><span class="tag t-om">'+Math.round(om.daily.temperature_2m_max[i])+'°/'+Math.round(om.daily.temperature_2m_min[i])+'° '+omR+'%</span></td><td><span class="tag t-gfs">'+Math.round(gfs.daily.temperature_2m_max[i])+'°/'+Math.round(gfs.daily.temperature_2m_min[i])+'°</span></td><td><span class="tag t-jma">'+jMx+'°/'+jMn+'°'+(jR!==null?' '+jR+'%':'')+'</span></td><td><div class="barwrap"><div class="barbg"><div class="barfill" style="width:'+bar+'%"></div></div><span style="font-size:12px;color:var(--info-text);min-width:32px">'+bar+'%</span></div></td></tr>';
  }).join('');

  document.getElementById('page-title').textContent=loc.name+' '+t('app_title');
  var wlKey=Object.keys(WL).find(function(k){return parseInt(k)===cCode;})||'';
  var wlText=wlKey?WL[wlKey].split('/')[getLang()==='ja'?0:1]||'—':'—';

  document.getElementById('main-content').innerHTML=
    '<div class="metrics">'
    +'<div class="mc"><div class="lb"><i class="ti ti-thermometer" style="font-size:13px;vertical-align:-1px;margin-right:3px"></i>'+t('cur_temp')+'</div><div class="vl">'+cTemp+'°C</div><div class="sb">'+wlText+'</div></div>'
    +'<div class="mc"><div class="lb"><i class="ti ti-temperature-plus" style="font-size:13px;vertical-align:-1px;margin-right:3px"></i>'+t('hi_lo')+'</div><div class="vl">'+avgMax+'°/'+avgMin+'°</div><div class="sb">'+t('avg_2src')+'</div></div>'
    +'<div class="mc"><div class="lb"><i class="ti ti-droplet" style="font-size:13px;vertical-align:-1px;margin-right:3px"></i>'+t('rain_prob')+'</div><div class="vl" style="color:var(--info-text)">'+rainToday+'%</div><div class="sb">'+t('today_max')+'</div></div>'
    +'<div class="mc"><div class="lb"><i class="ti ti-wind" style="font-size:13px;vertical-align:-1px;margin-right:3px"></i>'+t('wind')+'</div><div class="vl">'+cWind+'<span style="font-size:14px">m/s</span></div><div class="sb">'+t('current')+'</div></div>'
    +'<div class="mc"><div class="lb"><i class="ti ti-ripple" style="font-size:13px;vertical-align:-1px;margin-right:3px"></i>'+t('humidity')+'</div><div class="vl">'+cHum+'<span style="font-size:14px">%</span></div><div class="sb">'+t('current')+'</div></div>'
    +'</div>'
    // グラフ
    +buildChartSection()
    +buildJmaDetail(jma)
    +'<div class="stitle">'+t('src_forecast')+'</div>'
    +'<div class="mf"><div class="mfrow"><div></div>'+headHtml+'</div>'
    +'<div class="mfrow"><div class="mflb t-om">Open-Meteo</div>'+omCells+'</div>'
    +'<div class="mfrow"><div class="mflb t-gfs">GFS</div>'+gfsCells+'</div>'
    +'<div class="mfrow"><div class="mflb t-jma">'+t('jma_chip')+'</div>'+jmaCells+'</div>'
    +owmCells+tmrwCells+wapiCells+'</div>'
    +'<div class="stitle">'+t('hourly_forecast')+'</div>'
    +'<div class="hourly">'+hourlyHtml+'</div>'
    +'<div class="stitle">'+t('compare_5')+'</div>'
    +'<div style="overflow-x:auto;margin-bottom:1.5rem"><table class="ctbl"><thead><tr><th style="width:12%">'+t('date')+'</th><th style="width:28%">Open-Meteo</th><th style="width:20%">GFS</th><th style="width:22%">'+t('jma_chip')+'</th><th style="width:18%">'+t('rain_prob')+'</th></tr></thead><tbody>'+compareRows+'</tbody></table></div>'
    +'<div class="footer">Data: <a href="https://open-meteo.com" target="_blank" rel="noopener">Open-Meteo</a> / <a href="https://www.jma.go.jp" target="_blank" rel="noopener">JMA</a> / <a href="https://openweathermap.org" target="_blank" rel="noopener">OWM</a> / <a href="https://www.tomorrow.io" target="_blank" rel="noopener">Tomorrow.io</a> / <a href="https://www.weatherapi.com" target="_blank" rel="noopener">WeatherAPI</a> / Map: <a href="https://www.openstreetmap.org" target="_blank" rel="noopener">OpenStreetMap</a></div>';

  document.getElementById('updated-at').textContent=t('updated')+now.toLocaleTimeString(getLang()==='ja'?'ja-JP':'en-US',{hour:'2-digit',minute:'2-digit'})+' | '+loc.name+' ('+loc.lat+', '+loc.lon+')';

  // グラフ描画（DOM生成後）
  setTimeout(function(){buildCharts(om,gfs);},50);
}

async function loadAll(){
  document.getElementById('main-content').innerHTML='<div class="loading"><i class="ti ti-cloud-download" style="font-size:28px;display:block;margin-bottom:8px"></i>'+t('loading')+'</div>';
  document.getElementById('chip-owm').classList.remove('on');document.getElementById('chip-tmrw').classList.remove('on');document.getElementById('chip-wapi').classList.remove('on');
  var locs=loadLocations();var idx=getCurrentIdx();if(idx>=locs.length)idx=0;var loc=locs[idx];
  try{
    var ok=localStorage.getItem('owm_key')||'';
    var tk=localStorage.getItem('tmrw_key')||'';
    var wk=localStorage.getItem('wapi_key')||'';
    var results=await Promise.all([fetchOM(loc.lat,loc.lon),fetchGFS(loc.lat,loc.lon),fetchJMA(loc.jma),fetchOWM(loc.lat,loc.lon,ok),fetchTmrw(loc.lat,loc.lon,tk),fetchWapi(loc.lat,loc.lon,wk)]);
    buildContent(loc,results[0],results[1],results[2],results[3],results[4],results[5]);
  }catch(e){
    document.getElementById('main-content').innerHTML='<div class="errmsg"><i class="ti ti-alert-circle"></i> '+e.message+'</div>';
  }
}

window.addEventListener('DOMContentLoaded',function(){
  var savedLang=localStorage.getItem('lang')||'ja';
  document.documentElement.setAttribute('data-lang',savedLang);
  var savedTheme=localStorage.getItem('theme')||(window.matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light');
  document.documentElement.setAttribute('data-theme',savedTheme);
  document.getElementById('theme-icon').className=savedTheme==='dark'?'ti ti-sun':'ti ti-moon';
  document.getElementById('owm-key').value=localStorage.getItem('owm_key')||'';
  document.getElementById('tmrw-key').value=localStorage.getItem('tmrw_key')||'';
  document.getElementById('wapi-key').value=localStorage.getItem('wapi_key')||'';
  applyI18n();
  renderLocationBar();
  loadAll();
});
